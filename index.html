<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Connection Test</title>
</head>

<body>

  <h1>Festival Backend Test</h1>

  <button onclick="testBackend()">
    Test Backend
  </button>

  <p id="result">
    Press the button.
  </p>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbywtvZNlTp0li50wfXuPzWvfPpvMCT5Qh7CuMkXXp9oJk7WkAnrkNhTR-J5E9xAb6E9dw/exec";

    async function testBackend() {

      document.getElementById("result").innerText =
        "Connecting...";

      const data = {
        volunteerId: "VOL-003",
        pin: "9012",
        token: "TEST-AMA-001"
      };

      try {

        const response = await fetch(
          API_URL,
          {
            method: "POST",
            body: JSON.stringify(data)
          }
        );

        const result = await response.json();

        document.getElementById("result").innerText =
          JSON.stringify(result, null, 2);

      } catch (error) {

        document.getElementById("result").innerText =
          "ERROR:\n" + error.message;

      }

    }

  </script>

</body>
</html>
