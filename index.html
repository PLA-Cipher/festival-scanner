<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Festival QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Festival QR Scanner</h1>

    <p>
      Point the camera at a QR code.
    </p>

    <div id="reader"></div>

    <p id="result">
      Starting scanner...
    </p>

  </div>


  <script>
const API_URL = "https://script.google.com/macros/s/AKfycbywtvZNlTp0li50wfXuPzWvfPpvMCT5Qh7CuMkXXp9oJk7WkAnrkNhTR-J5E9xAb6E9dw/exec";
    function onScanSuccess(decodedText) {

      document
        .getElementById("result")
        .innerText =
        "QR detected:\n" +
        decodedText;

    }


    function onScanFailure(error) {

      // Ignore normal scanning failures.
      // The scanner keeps looking for a QR code.

    }


    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        false

      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>

</html>
