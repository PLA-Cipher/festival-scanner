<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accra Kizomba Festival 2026 - Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --gold: #facc15;
      --gold-hover: #eab308;
      --green: #22c55e;
      --red: #ef4444;
      --bg-dark: #09090b;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(rgba(10, 10, 12, 0.85), rgba(10, 10, 12, 0.92)), 
                  url('flyer.png') no-repeat center center fixed;
      background-size: cover;
      color: #f8fafc;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: rgba(24, 24, 27, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 24px;
      border: 1px solid rgba(250, 204, 21, 0.2);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 20px rgba(250, 204, 21, 0.05);
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-sizing: border-box;
    }

    .container.success-flash {
      background-color: rgba(6, 95, 70, 0.95) !important;
      border-color: var(--green);
    }

    .container.denied-flash {
      background-color: rgba(127, 29, 29, 0.95) !important;
      border-color: var(--red);
    }

    .festival-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      margin-top: 0;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .festival-subtitle {
      font-size: 0.85rem;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 20px;
    }

    p {
      color: #d4d4d8;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    #reader {
      width: 100% !important;
      border: 2px solid rgba(250, 204, 21, 0.3) !important;
      border-radius: 14px;
      overflow: hidden;
      margin: 15px 0;
      background: #000;
    }
    
    #reader video {
      width: 100% !important;
      height: auto !important;
      min-height: 250px;
      display: block !important;
      object-fit: cover;
    }

    #result {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 15px;
      white-space: pre-line;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0 16px 0;
      font-size: 1rem;
      background: #09090b;
      border: 1px solid #3f3f46;
      color: #fff;
      border-radius: 12px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--gold);
    }

    .manual-box {
      margin: 15px 0;
      display: flex;
      gap: 8px;
    }

    .manual-box input {
      margin: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      color: #09090b;
      background: var(--gold);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--gold-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .manual-box button {
      width: 35%;
      font-size: 0.85rem;
    }

    .event-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .counter-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
      background: rgba(34, 197, 94, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    #loginResult {
      color: var(--red);
      font-size: 0.9rem;
      margin-top: 10px;
      font-weight: 600;
    }
  </style>
</head>

<body>
<div class="container">
    <!-- Login Section -->
    <div id="loginSection">
      <div class="festival-title">Accra Kizomba 2026</div>
      <div class="festival-subtitle">Music • Dance • Heritage</div>
      <p>Volunteer Gate Portal</p>
      
      <input type="text" id="volunteerId" placeholder="Volunteer ID (e.g. VOL-003)">
      <input type="password" id="volunteerPin" placeholder="PIN Code">
      <button onclick="loginVolunteer()">Sign In to Gate</button>
      <p id="loginResult"></p>
    </div>

    <!-- Event Selection Section (New) -->
    <div id="eventSelectionSection" style="display: none;">
      <div class="festival-title" style="font-size: 1.3rem;">Select Active Gate</div>
      <div class="festival-subtitle">Choose Current Station</div>
      <p>Pick the event/gate you are scanning for right now:</p>
      
      <div class="event-buttons">
        <button onclick="selectEvent('FULL')">FULL EXPERIENCE</button>
        <button onclick="selectEvent('CORE')">CORE FESTIVAL</button>
        <button onclick="selectEvent('SOCIAL')">EVENING SOCIAL ONLY</button>
      </div>
    </div> <!-- THIS CLOSING TAG FIXES THE EMPTY BOX -->

    <!-- Scanner Section -->
    <div id="scannerSection" style="display: none;">
      <div class="header-bar">
        <span id="currentGateLabel" style="font-weight: 700; color: var(--gold); font-size: 0.85rem; text-transform: uppercase;">Gate: None</span>
        <button onclick="showEventSelection()" style="width: auto; padding: 6px 12px; font-size: 0.75rem; margin: 0;">Switch Event</button>
      </div>
      <div class="festival-title" style="font-size: 1.2rem;">Gate Scanner</div>
      
      <div class="counter-badge">
        Checked In Today: <span id="scanCounter">0</span>
      </div>

      <p style="margin-bottom: 10px;">Point camera at ticket QR code</p>
      
      <!-- Manual Entry Fallback -->
      <div class="manual-box">
        <input type="text" id="manualToken" placeholder="Type token...">
        <button onclick="submitManualToken()">Verify</button>
      </div>

      <div id="reader"></div>
      <div id="result">Ready to scan tickets.</div>
    </div>
  </div>

  <script>
    let sessionToken = null;
    let activeScanner = null;
    const API_URL = "https://script.google.com/macros/s/AKfycbywtvZNlTp0li50wfXuPzWvfPpvMCT5Qh7CuMkXXp9oJk7WkAnrkNhTR-J5E9xAb6E9dw/exec";
    let processingScan = false;
    let successfulScans = 0;
      
    async function loginVolunteer() {
      const volunteerId = document.getElementById("volunteerId").value.trim();
      const pin = document.getElementById("volunteerPin").value.trim();
      const loginResult = document.getElementById("loginResult");

      if (!volunteerId || !pin) {
        loginResult.innerText = "Please fill in all fields.";
        return;
      }

      loginResult.innerText = "Authenticating...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", volunteerId, pin })
        });

        const data = await response.json();

        if (!data.success) {
          loginResult.innerText = data.reason || "Authentication failed.";
          return;
        }

        sessionToken = data.sessionToken;
        document.getElementById("loginSection").style.display = "none";
        // Transition to Event Selection instead of directly opening scanner
        document.getElementById("eventSelectionSection").style.display = "block";
      } catch (error) {
        loginResult.innerText = "Server connection error.";
        console.error(error);
      }
    }

    async function selectEvent(activityId) {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "setActivity", sessionToken, activityId })
        });

        const data = await response.json();

        if (!data.success) {
          alert("Error setting event: " + data.reason);
          return;
        }

        document.getElementById("eventSelectionSection").style.display = "none";
        document.getElementById("scannerSection").style.display = "block";
        document.getElementById("currentGateLabel").innerText = "Gate: " + activityId;
        document.getElementById("result").innerText = "Ready to scan tickets.";

       setTimeout(() => {
         startScanner();
       }, 300);
      } catch (error) {
        alert("Server connection error while setting event.");
      }
    }

    function showEventSelection() {
      if (activeScanner) {
        activeScanner.stop().catch(err => console.log(err));
        activeScanner = null;
      }
      document.getElementById("scannerSection").style.display = "none";
      document.getElementById("eventSelectionSection").style.display = "block";
    }
      
  function startScanner() {
  if (activeScanner) return;

  activeScanner = new Html5Qrcode("reader");

  activeScanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0
    },
    onScanSuccess,
    function onScanFailure(error) {}
  ).then(() => {
    console.log("Scanner started successfully");

    const video = document.querySelector("#reader video");

    if (video) {
      video.style.width = "100%";
      video.style.height = "300px";
      video.style.display = "block";
      video.style.objectFit = "cover";
      console.log("Video element found:", video);
    } else {
      console.log("NO VIDEO ELEMENT FOUND");
    }
  }).catch(err => {
    console.error("Camera start error:", err);
  });
}

    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'success') {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    async function processToken(tokenText) {
      if (processingScan) return;
      processingScan = true;

      const container = document.querySelector(".container");
      document.getElementById("result").innerText = "Validating ticket...";

      try {
        const payload = { action: "scan", sessionToken, token: tokenText };
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.reason === "Session expired or invalid") {
          alert("Session expired. Please log in again.");
          location.reload();
          return;
        }

        document.getElementById("result").innerText = `${result.result}\n${result.reason}`;

        if (result.result === "GRANTED") {
          successfulScans++;
          document.getElementById("scanCounter").innerText = successfulScans;
          playSound('success');
          container.classList.add("success-flash");
          setTimeout(() => container.classList.remove("success-flash"), 1000);
        } else {
          playSound('denied');
          container.classList.add("denied-flash");
          setTimeout(() => container.classList.remove("denied-flash"), 1000);
        }
      } catch (error) {
        document.getElementById("result").innerText = "Network error:\n" + error.message;
        playSound('denied');
      }

      setTimeout(() => { processingScan = false; }, 2000);
    }

    function onScanSuccess(decodedText) {
      processToken(decodedText);
    }

    function submitManualToken() {
      const input = document.getElementById("manualToken");
      const token = input.value.trim();
      if (!token) return;
      input.value = "";
      processToken(token);
    }

    function onScanFailure(error) {}
  </script>
</body>
</html>
