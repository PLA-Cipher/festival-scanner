<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Festival QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      white-space: pre-line;
    }

  </style>

</head>

<body>

  <div class="container">

    <div id="loginSection">

      <h1>Volunteer Login</h1>

      <input
        type="text"
        id="volunteerId"
        placeholder="Volunteer ID"
      >

      <input
        type="password"
        id="volunteerPin"
        placeholder="PIN"
      >

      <button onclick="loginVolunteer()">
        Login
      </button>

      <p id="loginResult"></p>

    </div>

    <div id="scannerSection" style="display: none;">

      <h1>Festival QR Scanner</h1>

      <p>
        Point the camera at a QR code.
      </p>

      <div id="reader"></div>

      <p id="result">
        Starting scanner...
      </p>

    </div>

  </div>


  <script>
    let sessionToken = null;

    const API_URL =
      "https://script.google.com/macros/s/AKfycbywtvZNlTp0li50wfXuPzWvfPpvMCT5Qh7CuMkXXp9oJk7WkAnrkNhTR-J5E9xAb6E9dw/exec";


    let processingScan = false;
    
async function loginVolunteer() {

  const volunteerId =
    document.getElementById("volunteerId").value.trim();

  const pin =
    document.getElementById("volunteerPin").value.trim();

  const loginResult =
    document.getElementById("loginResult");

  if (!volunteerId || !pin) {

    loginResult.innerText =
      "Please enter your Volunteer ID and PIN.";

    return;
  }

  loginResult.innerText =
    "Logging in...";

  try {

    const response = await fetch(
      API_URL,
      {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          volunteerId: volunteerId,
          pin: pin
        })
      }
    );

    const data = await response.json();

    if (!data.success) {

      loginResult.innerText =
        data.reason || "Login failed.";

      return;
    }

    sessionToken = data.sessionToken;

    document.getElementById("loginSection")
      .style.display = "none";

    document.getElementById("scannerSection")
      .style.display = "block";

    document.getElementById("result")
      .innerText =
        "Login successful. Starting scanner...";

    startScanner();

  } catch (error) {

    loginResult.innerText =
      "Unable to connect to the server.";

    console.error(error);

  }

}
    
function startScanner() {

  const scanner =
    new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: 250
    },

    onScanSuccess,

    function onScanFailure(error) {
      // Ignore normal scanning failures
    }

  );

}

    async function onScanSuccess(decodedText) {

      if (processingScan) {
        return;
      }

      processingScan = true;


      document
        .getElementById("result")
        .innerText =
          "QR detected.\nChecking ticket...";


const data = {
  action: "scan",
  sessionToken: sessionToken,
  token: decodedText
};

const response = await fetch(
  API_URL,
  {
    method: "POST",
    body: JSON.stringify(data)
  }
);

        const result =
          await response.json();


        document
          .getElementById("result")
          .innerText =
            result.result +
            "\n" +
            result.reason;

      }

      catch (error) {

        document
          .getElementById("result")
          .innerText =
            "Connection error:\n" +
            error.message;

      }


      setTimeout(

        function() {

          processingScan = false;

        },

        2000

      );

    }


    function onScanFailure(error) {

      // Normal scanning failures are ignored.

    }


  </script>

</body>

</html>
